<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLife - Find Blood</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fff5f5;
        }

        /* NAVBAR */

        .navbar {
            background: #a80000;
            padding: 22px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ffb3b3;
        }

        .menu {
            display: flex;
            gap: 30px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .menu a:hover {
            color: #ffcccc;
        }

        /* MAIN */

        .main {
            min-height: calc(100vh - 75px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 750px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.12);
        }

        .card h1 {
            text-align: center;
            color: #a80000;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* SEARCH */

        .row {
            display: flex;
            gap: 20px;
        }

        .input {
            flex: 1;
            margin-bottom: 20px;
        }

        .input label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input input,
        .input select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 7px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #c00000;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #900000;
        }

        /* RESULT */

        #result {
            display: none;
            margin-top: 25px;
        }

        #result h2 {
            color: #a80000;
            margin-bottom: 15px;
        }

        .donor {
            padding: 18px;

            background: #fff5f5;

            border-left: 5px solid #c00000;

            border-radius: 7px;

            margin-bottom: 12px;
        }

        .donor h3 {
            color: #a80000;
            margin-bottom: 8px;
        }

        .donor p {
            color: #555;
            margin: 5px 0;
        }

        .call {
            display: inline-block;

            margin-top: 10px;

            padding: 9px 18px;

            background: #c00000;
            color: white;

            text-decoration: none;

            border-radius: 5px;
        }

        /* MOBILE */

        @media(max-width:700px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .menu {
                gap: 15px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🩸 Blood<span>Life</span>
    </div>

    <div class="menu">

        <a href="index.html">Home</a>

        <a href="donate.html">Donate</a>

        <a href="find.html">Find Blood</a>

        <a href="contact.html">Contact</a>

    </div>

</nav>


<div class="main">

    <div class="card">

        <h1>🔎 Find Blood</h1>

        <p class="subtitle">
            Search for blood donors in your city.
        </p>


        <div class="row">

            <div class="input">

                <label>Blood Group</label>

                <select id="blood">

                    <option value="">
                        Select Blood Group
                    </option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>

                </select>

            </div>


            <div class="input">

                <label>City</label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter city"
                >

            </div>

        </div>


        <button onclick="searchBlood()">
            Search Blood
        </button>


        <div id="result">

            <h2>Available Donors</h2>

            <div class="donor">

                <h3>🩸 Rahul Patil</h3>

                <p>
                    Blood Group:
                    <strong>O+</strong>
                </p>

                <p>
                    City: Pune
                </p>

                <p>
                    📞 9876543210
                </p>

                <a
                    href="tel:9876543210"
                    class="call"
                >
                    Call Donor
                </a>

            </div>

        </div>

    </div>

</div>


<script>

function searchBlood() {

    let blood =
        document.getElementById("blood").value;

    let city =
        document.getElementById("city").value;

    if (blood === "" || city === "") {

        alert(
            "Please select blood group and enter city."
        );

        return;
    }

    document
    .getElementById("result")
    .style.display = "block";

}

</script>

</body>
</html>
