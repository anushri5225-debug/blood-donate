<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLife - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        .page {
            height: 100vh;
            position: relative;
            color: white;

            background:
                linear-gradient(
                    rgba(70,0,0,0.75),
                    rgba(20,0,0,0.90)
                ),
                url("https://images.unsplash.com/photo-1615461066841-6116e61058f4?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;
        }

        /* NAVBAR */

        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding: 25px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(0,0,0,0.20);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff6666;
        }

        .menu {
            display: flex;
            gap: 30px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .menu a:hover {
            color: #ff5555;
        }

        /* CONTENT */

        .content {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 30px;
        }

        .blood {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .content h1 {
            font-size: 65px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .content h1 span {
            color: #ff4d4d;
        }

        .content p {
            font-size: 20px;
            line-height: 1.6;
        }

        /* MOBILE */

        @media(max-width:700px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .menu {
                gap: 15px;
            }

            .content h1 {
                font-size: 42px;
            }

            .content p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <nav class="navbar">

        <div class="logo">
            🩸 Blood<span>Life</span>
        </div>

        <div class="menu">

            <a href="index.html">Home</a>

            <a href="donate.html">Donate</a>

            <a href="find.html">Find Blood</a>

            <a href="contact.html">Contact</a>

        </div>

    </nav>


    <div class="content">

        <div>

            <div class="blood">
                🩸
            </div>

            <h1>
                Donate Blood,<br>
                <span>Save Lives.</span>
            </h1>

            <p>
                Your one donation can give someone
                another chance at life.
            </p>

        </div>

    </div>

</div>

</body>
</html>
